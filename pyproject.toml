[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybhav"
version = "0.0.2"
description = "Download NSE bhavcopy (end-of-day market data) for Indian equities and derivatives"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Prashant Singh", email = "box_prashant@outlook.com" }]
keywords = ["nse", "bhavcopy", "india", "stock market", "finance", "equity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "curl_cffi>=0.7.0",
    "pandas>=1.5",
]

[project.optional-dependencies]
async = []
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/prashant-fintech/pybhav"
Issues = "https://github.com/prashant-fintech/pybhav/issues"

[tool.hatch.build.targets.wheel]
packages = ["pybhav"]
